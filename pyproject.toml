[project]
name = "st-andreas"
version = "1.0.0"
description = "St. Andreas data pipelines and tools"
requires-python = ">=3.11"
dependencies = [
    "aioclock>=0.1",
    "lxml>=5.0",
    "lxml-stubs>=0.5.1",
    "openpyxl>=3.0",
    "pandas>=2.0",
    "pymysql>=1.1",
]

[project.optional-dependencies]
dev = [
    "dirty-equals>=0.7",
    "inline-snapshot>=0.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
backup-scheduler = "st_andreas.backup.scheduler:main"
fetch-members-all = "st_andreas.pipelines.fetch_members_all:main"
fetch-members-no-kontoinhaber = "st_andreas.pipelines.fetch_members_no_kontoinhaber:main"
members-27-plus = "st_andreas.pipelines.members_27_plus:main"
sepa-lastschrift = "st_andreas.pipelines.sepa_lastschrift:main"
sepa-returns = "st_andreas.pipelines.sepa_returns:main"
spendenquittungen = "st_andreas.pipelines.spendenquittungen:main"
sippe = "st_andreas.sippe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/st_andreas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
