[project]
name = "st-andreas"
version = "1.0.0"
description = "St. Andreas data pipelines and tools"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.0",
    "pandas>=2.0",
    "pymysql>=1.1",
]

[project.optional-dependencies]
dev = [
    "dirty-equals>=0.7",
    "inline-snapshot>=0.10",
    "pytest>=8.0",
]

[project.scripts]
fetch-members = "st_andreas.fetch_members:main"
spendenquittungen = "st_andreas.spendenquittungen:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/st_andreas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PTH"]
